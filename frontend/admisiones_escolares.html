<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admisiones escolares</title>
    <link rel="stylesheet" href="admisiones_escolares.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="admisiones_escolares.js" defer></script>
</head>
<body>
    <!----------------------------------------->
    <!--|estructuracion_admisiones_escolares|-->
    <!----------------------------------------->
    <header class="encabezado">
        <div class="icono_encabezado">
            <i class="fa-solid fa-school"></i>
        </div>
        <div>
            <span class="etiqueta">PROCESO DE INSCRIPCIÓN</span>
            <h1>Admisión Escolar</h1>
            <p>Formulario básico para registrar un estudiante.</p>
        </div>
    </header>
    <!----------------------------------------------->
    <!--|estructuracion_informacion_del_formulario|-->
    <!----------------------------------------------->
    <main class="contenedor">
        <section class="introduccion">
            <div class="icono_introduccion">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <div>
                <h2>Datos del estudiante</h2>
                <p>Completa la información solicitada para realizar la inscripción.</p>
            </div>
        </section>
        <!---------------------->
        <!--|datos_personales|-->
        <!---------------------->
        <form id="formularioInscripcion" class="formulario" novalidate>
            <div class="seccion_formulario">
                <div class="titulo_seccion">
                    <i class="fa-solid fa-id-card"></i>
                    <h3>Información personal</h3>
                </div>
                <div class="grupo_campos">
                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Ejemplo: Juan Pérez" maxlength="100" autocomplete="name" required>
                    </div>
                    <div class="campo">
                        <label for="documento">Documento</label>
                        <input type="text" id="documento" placeholder="Número de documento" maxlength="30" required>
                    </div>
                    <div class="campo">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" placeholder="Edad" min="1" max="120" step="1" required>
                    </div>
                    <div class="campo">
                        <label for="grado">Grado</label>
                        <select id="grado" required>
                            <option value="">Seleccionar grado</option>
                            <option value="6°">6°</option>
                            <option value="7°">7°</option>
                            <option value="8°">8°</option>
                            <option value="9°">9°</option>
                            <option value="10°">10°</option>
                            <option value="11°">11°</option>
                        </select>
                    </div>
                </div>
            </div>
            <!----------------------->
            <!--|datos_de_contacto|-->
            <!----------------------->
            <div class="seccion_formulario">
                <div class="titulo_seccion">
                    <i class="fa-solid fa-address-book"></i>
                    <h3>Información de contacto</h3>
                </div>
                <div class="grupo_campos">
                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com" maxlength="150" autocomplete="email">
                    </div>
                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="Número de teléfono" maxlength="30" autocomplete="tel">
                    </div>
                    <div class="campo campo_completo">
                        <label for="acudiente">Nombre del acudiente</label>
                        <input type="text" id="acudiente" placeholder="Nombre del padre, madre o acudiente" maxlength="100">
                    </div>
                </div>
            </div>
            <!------------------->
            <!--|observaciones|-->
            <!------------------->
            <div class="seccion_formulario">
                <div class="titulo_seccion">
                    <i class="fa-solid fa-comment"></i>
                    <h3>Observaciones</h3>
                </div>
                <label for="observaciones" class="etiqueta_observaciones">Observaciones adicionales</label>
                <textarea id="observaciones" maxlength="1000" placeholder="Escribe alguna observación..."></textarea>
            </div>
            <!------------->
            <!--|botones|-->
            <!------------->
            <div class="botones">
                <button type="button" id="guardar" class="boton guardar">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Guardar inscripción
                </button>
                <button type="button" id="limpiar" class="boton limpiar">
                    <i class="fa-solid fa-eraser"></i>
                    Limpiar
                </button>
            </div>
            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </form>
        <!-------------------------->
        <!--|inscripcion_guardada|-->
        <!-------------------------->
        <section class="registro_guardado">
            <div class="titulo_guardado">
                <i class="fa-solid fa-folder-open"></i>
                <h2>Inscripción guardada</h2>
            </div>
            <div id="datosGuardados" class="datos_guardados" aria-live="polite">
                <p>No hay información guardada.</p>
            </div>
            <div class="botones botones_registro">
                <button type="button" id="restaurar" class="boton restaurar">
                    <i class="fa-solid fa-rotate-left"></i>
                    Restaurar datos
                </button>
                <button type="button" id="eliminar" class="boton eliminar">
                    <i class="fa-solid fa-trash"></i>
                    Eliminar inscripción
                </button>
            </div>
        </section>
    </main>
</body>
</html>
